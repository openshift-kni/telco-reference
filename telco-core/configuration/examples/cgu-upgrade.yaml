---
# Single release upgrade of the control plane, 5.0 -> 5.1.
#
# Remediates the policies generated by core-upgrade-policies.yaml, in the
# order listed. Worker MachineConfigPools are paused by core-upgrade-prep-5-1
# and remain paused when this CGU completes; apply cgu-upgrade-finish.yaml to
# release them.
#
# Named core-upgrade-5-1, matching the final hop of cgu-upgrade-double-hop.yaml
# so that cgu-upgrade-finish.yaml blocks on one name for either path. Use this
# file or cgu-upgrade-double-hop.yaml, not both.
#
# See README.md in this directory for the cluster labels to apply before
# starting, and for why the CGUs must not add each other's labels.
apiVersion: ran.openshift.io/v1alpha1
kind: ClusterGroupUpgrade
metadata:
  name: core-upgrade-5-1
  namespace: default
spec:
  clusterLabelSelectors:
    - matchLabels:
        common: "core"
        upgrade-version-5-1: ""
  # Alternatively, name the target clusters explicitly:
  # clusters:
  #   - cluster-1
  enable: true
  managedPolicies:
    - core-upgrade-prep-5-1
    - core-upgrade-ocp-5-1
    - core-upgrade-olm-5-1
    - core-upgrade-validate-5-1
  actions:
    afterCompletion:
      removeClusterLabels:
        - upgrade-version-5-1
      deleteObjects: true
  remediationStrategy:
    maxConcurrency: 1
    # timeout is in minutes
    timeout: 480
