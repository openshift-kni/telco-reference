---
# Single release upgrade of the control plane, 5.0 -> 5.1.
#
# Remediates the policies generated by core-upgrade.yaml, in the order listed.
# Worker MachineConfigPools are paused by core-upgrade-prep-5-1 and remain
# paused when this CGU completes; apply cgu-upgrade-finish.yaml to release
# them.
#
# Apply every stage label to the ManagedCluster before starting, not one stage
# at a time. Each CGU then removes only its own label on completion. Having a
# CGU add the next stage's label does not work reliably: the placement binding
# and policies take time to propagate, and the following CGU can start before
# its policies are bound. Pre-applying the labels is safe because each CGU
# names only the policies for its own stage, and the policy names are unique
# per release.
#
# For this single hop:
#   oc label managedcluster <cluster> upgrade-version-5-1= upgrade-finish=
#
# This CR is applied to the hub directly ("oc apply -f"). It is deliberately
# not rendered by configuration/kustomization.yaml -- syncing a CGU through
# GitOps would start the upgrade as soon as Argo CD reconciles.
apiVersion: ran.openshift.io/v1alpha1
kind: ClusterGroupUpgrade
metadata:
  name: core-upgrade-5-1
  namespace: default
spec:
  clusterLabelSelectors:
    - matchLabels:
        common: "core"
        upgrade-version-5-1: ""
  # Alternatively, name the target clusters explicitly:
  # clusters:
  #   - cluster-1
  enable: true
  managedPolicies:
    - core-upgrade-prep-5-1
    - core-upgrade-ocp-5-1
    - core-upgrade-olm-5-1
    - core-upgrade-validate-5-1
  actions:
    afterCompletion:
      # Drop this stage's label so its policies stop binding. The labels for
      # the later stages are already on the cluster, applied up front.
      removeClusterLabels:
        - upgrade-version-5-1
      deleteObjects: true
  remediationStrategy:
    maxConcurrency: 1
    # timeout is in minutes
    timeout: 480
