---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  # Example only: replace with the name of your Core secret store.
  name: replace-with-your-store-name
spec:
  # IMPORTANT:
  # Restricts use to namespaces explicitly labeled for this store. No
  # namespace carries this label by default, so applying the example as-is
  # is harmless until namespaces are deliberately labeled. Replace the
  # label key/value with your own before deploying.
  conditions:
    - namespaceSelector:
        matchLabels:
          example.com/configure-before-use: "required"
  provider:
    vault:
      server: "https://vault.example.com:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-operator
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
