---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: nvidia-gpu-management-workload
  annotations:
    ran.openshift.io/ztp-deploy-wave: '1'
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: nvidia-gpu-operator
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
  matchConditions:
    - name: operator-managed-pod
      expression: >-
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(o,
          has(o.controller) && o.controller &&
          o.kind in ['DaemonSet', 'ReplicaSet', 'ClusterPolicy'])
    - name: management-runtime
      expression: >-
        !has(object.spec.runtimeClassName) ||
        object.spec.runtimeClassName in ['nvidia', 'nvidia-cdi', 'nvidia-legacy']
    - name: no-gpu-allocation
      expression: >-
        (object.spec.containers +
          (has(object.spec.initContainers) ? object.spec.initContainers : [])).all(c,
          !has(c.resources) ||
          ((!has(c.resources.requests) ||
            !c.resources.requests.exists(k, k.startsWith('nvidia.com/'))) &&
           (!has(c.resources.limits) ||
            !c.resources.limits.exists(k, k.startsWith('nvidia.com/')))))
    - name: no-dra-allocation
      expression: >-
        !has(object.spec.resourceClaims) || size(object.spec.resourceClaims) == 0
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              annotations: {
                "target.workload.openshift.io/management":
                  '{"effect":"PreferredDuringScheduling"}'
              }
            }
          }
