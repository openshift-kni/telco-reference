# Sample only: customize components, driver image, and versions with your NVIDIA partner.
---
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
spec:
  operator:
    use_ocp_driver_toolkit: false
  cdi:
    enabled: true
    nriPluginEnabled: false
  sandboxWorkloads:
    enabled: false
    defaultWorkload: container
    mode: kubevirt
  driver:
    enabled: false
    useNvidiaDriverCRD: true
  dcgmExporter:
    enabled: true
    serviceMonitor:
      enabled: true
  dcgm:
    enabled: true
  daemonsets:
    updateStrategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: '1'
  devicePlugin:
    enabled: true
    mps:
      root: /run/nvidia/mps
  gfd:
    enabled: true
  migManager:
    enabled: true
  nodeStatusExporter:
    enabled: true
  mig:
    strategy: single
  toolkit:
    enabled: true
  vgpuManager:
    enabled: false
  vgpuDeviceManager:
    enabled: true
  sandboxDevicePlugin:
    enabled: true
  kataSandboxDevicePlugin:
    enabled: true
  vfioManager:
    enabled: true
  ccManager:
    enabled: true
  gds:
    enabled: false
  gdrcopy:
    enabled: false
