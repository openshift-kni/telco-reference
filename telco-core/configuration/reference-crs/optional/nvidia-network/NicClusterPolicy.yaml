---
apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
spec:
  ofedDriver:
    repository: registry.example.com:5000/nvidia
    image: doca-driver-rhel10
    version: sha256:02792cf44b818d2f1bb319a3df5907c4510331318e2add0152e723a5013050cf
    forcePrecompiled: true
    imagePullSecrets:
      - ofed-pull-secret
    # Verify RDMA storage is unused before allowing its modules to unload.
    env:
      - name: UNLOAD_STORAGE_MODULES
        value: "true"
      - name: RESTORE_DRIVER_ON_POD_TERMINATION
        value: "false"
    terminationGracePeriodSeconds: 300
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 20
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 30
    # Automatic upgrades can interrupt NIC traffic on multiple nodes at once without draining.
    upgradePolicy:
      autoUpgrade: true
      maxParallelUpgrades: 0
      safeLoad: false
      drain:
        enable: false
        force: false
  docaTelemetryService:
    repository: nvcr.io/nvidia/doca
    image: doca_telemetry
    version: sha256:3ec2bb66428e5a6c7137ed9680c03dba03618b03521d92bdcbdb2d7e2e53e029
  # Optional: select a dedicated interface outside existing SR-IOV resource pools.
  # Replace the example interface and use a verified mirrored image if disconnected.
  # rdmaSharedDevicePlugin:
  #   config: |-
  #     {
  #       "configList": [
  #         {
  #           "resourceName": "rdmashared",
  #           "rdmaHcaMax": 1000,
  #           "selectors": {
  #             "ifNames": ["enp1s0f1np1"]
  #           }
  #         }
  #       ]
  #     }
  #   image: k8s-rdma-shared-dev-plugin
  #   imagePullSecrets: []
  #   repository: ghcr.io/mellanox
  #   version: sha256:78f01edc4cc6f5f1282b5e4bf0a0d0291ee97c1bdb372616daa5367e1070269e
status:
  state: ready
