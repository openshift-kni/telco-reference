# PolicyGenerator input: annotate existing operator-managed DaemonSets.
# Reapply after operator upgrades and replace existing pods to change affinity.
apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: nvidia-network-management-cpus
spec:
  remediationAction: inform
  severity: low
  object-templates:
  - complianceType: musthave
    objectSelector:
      matchExpressions:
      - key: nvidia.network-operator.state
        operator: In
        values:
        - state-OFED
        - state-doca-telemetry-service
    objectDefinition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        namespace: nvidia-network-operator
      spec:
        template:
          metadata:
            annotations:
              target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
