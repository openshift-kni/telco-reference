# optional
# count: 1
---
# Core Observability configuration
# ACM 5.0+: observatorium-api URL is available from the spoke side; alerts forward via observatorium-api with mTLS.
# ACM 4.x:  requires the observabilityRoutePolicy from the telco-hub reference to propagate the alertmanager URL
#            and hub cluster ID as ManagedCluster annotations; alerts forward via the alertmanager route with ingress CA.
# When MCO is disabled and no legacy route annotation is present, the fallback renders an empty staticConfigs list.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    observability.open-cluster-management.io/unmanaged: "true"
data:
  config.yaml: |
    nodeExporter:
      collectors:
        buddyinfo: {}
        cpufreq: {}
        ksmd: {}
        mountstats: {}
        netclass: {}
        netdev: {}
        processes: {}
        systemd: {}
        tcpstat: {}
    prometheusK8s:
      additionalAlertmanagerConfigs:
      - apiVersion: v2
        bearerToken:
          key: token
          name: {{ $hubInfo := dict -}}
                {{ with (lookup "v1" "Secret" "open-cluster-management-addon-observability" "hub-info-secret") -}}
                  {{ $hubInfo = (index .data "hub-info.yaml" | base64dec | fromYaml) -}}
                {{ end -}}
                {{ $fwdRoute := index $hubInfo "hub-alerts-forwarding-route" -}}
                {{ if $fwdRoute -}}
                  {{ $hubID := index $hubInfo "hub-cluster-id" -}}
                  observability-alertmanager-accessor{{ if $hubID }}-{{ $hubID }}{{ end }}
        pathPrefix: /api/alertmanager/v2/default
        scheme: https
        staticConfigs: [{{ trimPrefix "https://" $fwdRoute | regexFind "^[^/]+" }}]
        tlsConfig:
          ca:
            key: ca.crt
            name: obs-alertmanager-mtls-ca{{ if $hubID }}-{{ $hubID }}{{ end }}
          cert:
            key: tls.crt
            name: obs-alertmanager-mtls-cert{{ if $hubID }}-{{ $hubID }}{{ end }}
          key:
            key: tls.key
            name: obs-alertmanager-mtls-cert{{ if $hubID }}-{{ $hubID }}{{ end }}
          insecureSkipVerify: false
          {{- else -}}
          {{hub $hubID := index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.annotations "acm-hub-cluster-id" hub}}observability-alertmanager-accessor{{hub if $hubID hub}}-{{hub $hubID hub}}{{hub end hub}}
        scheme: https
        staticConfigs: {{hub $alertmanagerRoute := index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.annotations "acm-alertmanager-route" hub}}[{{hub if $alertmanagerRoute hub}}{{hub $alertmanagerRoute hub}}{{hub end hub}}]
        tlsConfig:
          ca:
            key: service-ca.crt
            name: {{hub $hubID2 := index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.annotations "acm-hub-cluster-id" hub}}hub-alertmanager-router-ca{{hub if $hubID2 hub}}-{{hub $hubID2 hub}}{{hub end hub}}
          insecureSkipVerify: false{{ end }}
      externalLabels:
        managed_cluster: {{hub index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.labels "clusterID" hub}}
      retention: 15d
      volumeClaimTemplate:
        spec:
          storageClassName: ocs-external-storagecluster-ceph-rbd
          resources:
            requests:
              storage: 100Gi
    alertmanagerMain:
      volumeClaimTemplate:
        spec:
          storageClassName: ocs-external-storagecluster-ceph-rbd
          resources:
            requests:
              storage: 20Gi
