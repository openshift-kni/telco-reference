---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: core-customer-policies-5-1
policyDefaults:
  namespace: ztp-core-policies
  policySets: []
  placement:
    labelSelector:
      matchLabels:
        common: "core"
        version: "5.1"
  remediationAction: "inform"
policies:
  # unpause baseline configuration at the end of initial installation
  - name: core-install-mcp-unpause-5-1
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "200"
    placement:
      labelSelector:
        matchExpressions:
          - key: common
            operator: In
            values:
              - "core"
          - key: version
            operator: In
            values:
              - "5.1"
          - key: ztp-done
            operator: DoesNotExist
    # Unpauses the MCPs that were paused during initial creation and sets
    # maxUnavailable to 100% to speed up the deployment. Updating every MCP at
    # once is safe here only because no workloads are running yet, which is
    # why the placement above requires ztp-done to not exist -- the policy is
    # bound during installation and unbound once the cluster is in service.
    # Upgrades roll through the MCPs one at a time instead, using the
    # core-upgrade-workers-N policies in core-upgrade-mcps.yaml.
    # Only required once, so there is no need to re-evaluate it afterwards.
    evaluationInterval:
      compliant: never
    manifests:
      # The MCPs should be added as extra manifests at installation time. Their
      # inclusion here will reset the pause to false, allowing the MCPs to update
      - path: reference-crs/custom-manifests/mcp-worker-1.yaml
        patches:
        - spec:
            paused: false
            maxUnavailable: 100%
          status:
            conditions:
            - type: Updated
              status: "True"
            - type: Updating
              status: "False"

      - path: reference-crs/custom-manifests/mcp-worker-2.yaml
        patches:
        - spec:
            paused: false
            maxUnavailable: 100%
          status:
            conditions:
            - type: Updated
              status: "True"
            - type: Updating
              status: "False"

      - path: reference-crs/custom-manifests/mcp-worker-3.yaml
        patches:
        - spec:
            paused: false
            maxUnavailable: 100%
          status:
            conditions:
            - type: Updated
              status: "True"
            - type: Updating
              status: "False"

  - name: core-custom-mcp-set-maxavailable-5-1
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "201"
    manifests:
      # This sets the desired maxUnavailable on the customMCPs
      - path: reference-crs/custom-manifests/mcp-worker-1.yaml
        patches:
        - spec:
            maxUnavailable: 1
      - path: reference-crs/custom-manifests/mcp-worker-2.yaml
        patches:
        - spec:
            maxUnavailable: 1
      - path: reference-crs/custom-manifests/mcp-worker-3.yaml
        patches:
        - spec:
            maxUnavailable: 1
