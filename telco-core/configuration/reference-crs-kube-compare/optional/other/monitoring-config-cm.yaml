# optional
# count: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    nodeExporter:
      collectors:
        buddyinfo: {}
        cpufreq: {}
        ksmd: {}
        mountstats: {}
        netclass: {}
        netdev: {}
        processes: {}
        systemd: {}
        tcpstat: {}
    prometheusK8s:
      additionalAlertmanagerConfigs:
      - apiVersion: v2
        bearerToken:
          key: token
          name: (?<observability_alertmanager_accessor>.*)
        pathPrefix: /api/alertmanager/v2/default
        scheme: https
        staticConfigs: (?<observatorium_api_endpoint>.*)
        tlsConfig:
          ca:
            key: ca.crt
            name: (?<obs_alertmanager_mtls_ca>.*)
          cert:
            key: tls.crt
            name: (?<obs_alertmanager_mtls_cert>.*)
          key:
            key: tls.key
            name: (?<obs_alertmanager_mtls_cert_key>.*)
          insecureSkipVerify: false
      externalLabels:
        managed_cluster: (?<managed_cluster>.*)
      retention: 15d
      volumeClaimTemplate:
        spec:
          storageClassName: ocs-external-storagecluster-ceph-rbd
          resources:
            requests:
              storage: 100Gi
    alertmanagerMain:
      volumeClaimTemplate:
        spec:
          storageClassName: ocs-external-storagecluster-ceph-rbd
          resources:
            requests:
              storage: 20Gi
