---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: nfd-operators
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  # Replace with the customer's mirrored NFD catalog image.
  image: {{ .spec.image }}
  displayName: Node Feature Discovery
  publisher: Red Hat
  updateStrategy:
    registryPoll:
      interval: 1h
