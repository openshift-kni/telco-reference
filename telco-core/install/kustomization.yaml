---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- example-standard-clusterinstance.yaml

configMapGenerator:
- name: extra-manifests-configmap
  namespace: example-standard
  files:
  - extra-manifests/Network.yaml
  - extra-manifests/clusterimagepolicy-telco-core-operators.yaml
  - extra-manifests/control-plane-load-kernel-modules.yaml
  - extra-manifests/kdump-master.yaml
  - extra-manifests/kdump-worker.yaml
  - extra-manifests/mc_rootless_pods_selinux.yaml
  - extra-manifests/mount_namespace_config_master.yaml
  - extra-manifests/mount_namespace_config_worker.yaml
  - extra-manifests/sctp_module_mc.yaml
  - extra-manifests/worker-load-kernel-modules.yaml
- name: custom-manifests-configmap
  namespace: example-standard
  files:
  - custom-manifests/mcp-worker-1.yaml
  - custom-manifests/mcp-worker-2.yaml
  - custom-manifests/mcp-worker-3.yaml
# Optional NVIDIA video workaround: uncomment this generator and the matching
# extraManifestsRefs entry. Use the target ClusterInstance namespace and include
# only the master/worker files needed by affected GPU nodes.
# - name: nvidia-video-workaround
#   namespace: example-standard
#   files:
#   - extra-manifests/optional/nvidia-gpu-operator/50-nvidia-video-master.yaml
#   - extra-manifests/optional/nvidia-gpu-operator/50-nvidia-video-worker.yaml
# Optional DMA-BUF PCIe configuration: verify hardware/topology prerequisites
# before enabling this generator and the matching extraManifestsRefs entry.
# Include only roles hosting the target GPU and NIC devices.
# - name: nvidia-dmabuf-pcie
#   namespace: example-standard
#   files:
#   - extra-manifests/optional/nvidia-gpu-operator/99-nvidia-dmabuf-pcie-master.yaml
#   - extra-manifests/optional/nvidia-gpu-operator/99-nvidia-dmabuf-pcie-worker.yaml
generatorOptions:
  disableNameSuffixHash: true
