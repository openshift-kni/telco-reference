---
apiVersion: config.openshift.io/v1
kind: ClusterImagePolicy
metadata:
  name: telco-core-operators
spec:
  policy:
    rootOfTrust:
      policyType: PublicKey
      publicKey:
        keyData: 
  scopes:
    # openshift-cert-manager-operator
    - registry.redhat.io/cert-manager
    # openshift-external-secrets-operator
    - registry.redhat.io/external-secrets-operator
    # multicluster-engine
    - registry.redhat.io/multicluster-engine
    # cephcsi-operator, mcg-operator, ocs-client-operator, ocs-operator, odf-csi-addons-operator,
    # odf-dependencies, odf-external-snapshotter-operator, odf-operator, odf-prometheus-operator, recipe,
    # rook-ceph-operator
    - registry.redhat.io/odf4
    # cluster-logging, loki-operator
    - registry.redhat.io/openshift-logging
    # advanced-cluster-management, cephcsi-operator, kubernetes-nmstate-operator, metallb-operator,
    # multicluster-engine, numaresources-operator, ocs-client-operator, ocs-operator,
    # odf-csi-addons-operator, odf-operator, odf-prometheus-operator, rook-ceph-operator,
    # sriov-network-operator, topology-aware-lifecycle-manager
    - registry.redhat.io/openshift4
    # advanced-cluster-management
    - registry.redhat.io/rhacm2
    # ocs-operator
    - registry.redhat.io/rhceph
    # advanced-cluster-management, mcg-operator, multicluster-engine, ocs-operator
    - registry.redhat.io/rhel9
    # node-healthcheck-operator, self-node-remediation
    - registry.redhat.io/workload-availability
