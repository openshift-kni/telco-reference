# Optional, topology-specific DMA-BUF GPUDirect RDMA configuration.
# Validated on QuantaEdge EGN77C-2U with NVIDIA Grace, RTX PRO 4500 Blackwell,
# and ConnectX-8 devices beneath a shared Mellanox PCIe switch hierarchy.
# ACS redirect blocked NIC-to-GPU P2P; disabling it with IOMMU passthrough
# enabled passed GPU-memory RDMA validation. Other platforms need their own
# topology checks and vendor-recommended ACS settings before enabling this.
# 15b3:197c identifies a PCIe bridge model, not the CX-8 Ethernet function;
# the argument matches every bridge with that ID, not just one NIC or slot.
# This is not a universal CX-8 requirement and changes IOMMU group isolation.
# IOMMU translated mode with ACS redirect disabled has not been validated.
# Applying kernel arguments to existing nodes triggers an MCO rollout/reboot.
# https://docs.nvidia.com/multi-node-nvlink-systems/grace-blackwell-cx8-gpudirect-rdma-guide/gpudirect_rdma_testing.html
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-nvidia-dmabuf-pcie-master
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.2.0
  kernelArguments:
    - iommu.passthrough=1
    - pci=disable_acs_redir=pci:15b3:197c
