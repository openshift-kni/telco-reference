# This CR verifies the installation/upgrade of the NVIDIA GPU Operator.
---
apiVersion: operators.coreos.com/v1
kind: Operator
metadata:
  name: gpu-operator-certified.nvidia-gpu-operator
  annotations:
    ran.openshift.io/ztp-deploy-wave: "2"
status:
  components:
    refs:
    - kind: Subscription
      namespace: nvidia-gpu-operator
      conditions:
      - type: CatalogSourcesUnhealthy
        status: "False"
    - kind: InstallPlan
      namespace: nvidia-gpu-operator
      conditions:
      - type: Installed
        status: "True"
    - kind: ClusterServiceVersion
      namespace: nvidia-gpu-operator
      conditions:
      - type: Succeeded
        status: "True"
        reason: InstallSucceeded
