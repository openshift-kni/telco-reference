---
# RAN Observability configuration
# ACM 5.0+: reads the observatorium route from the spoke hub-info-secret and forwards with mTLS.
# ACM 4.x: requires observabilityRoutePolicy in the 4.x hub reference for the alertmanager route and hub ID.
# When MCO is disabled and no route is available, omit alert forwarding.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    ran.openshift.io/ztp-deploy-wave: "1"
data:
  config.yaml: |
    alertmanagerMain:
      enabled: false
    telemeterClient:
      enabled: false
    nodeExporter:
      collectors:
        buddyinfo: {}
        cpufreq: {}
        ksmd: {}
        mountstats: {}
        netclass: {}
        netdev: {}
        processes: {}
        systemd: {}
        tcpstat: {}
    prometheusK8s:
      {{ $hubInfo := dict }}{{ with (lookup `v1` `Secret` `open-cluster-management-addon-observability` `hub-info-secret`) }}{{ $hubInfo = (index .data `hub-info.yaml` | base64dec | fromYaml) }}{{ end }}{{ $fwdRoute := index $hubInfo `hub-alerts-forwarding-route` }}{{ if $fwdRoute }}
      additionalAlertmanagerConfigs:
      - apiVersion: v2
        bearerToken:
          key: token
          name: {{ $hubID := index $hubInfo `hub-cluster-id` }}{{ if $hubID }}observability-alertmanager-accessor-{{ $hubID }}{{ else }}observability-alertmanager-accessor{{ end }}
        pathPrefix: /api/alertmanager/v2/default
        scheme: https
        staticConfigs: [{{ trimPrefix `https://` $fwdRoute | regexFind `^[^/]+` }}]
        tlsConfig:
          ca:
            key: ca.crt
            name: {{ if $hubID }}obs-alertmanager-mtls-ca-{{ $hubID }}{{ else }}obs-alertmanager-mtls-ca{{ end }}
          cert:
            key: tls.crt
            name: {{ if $hubID }}obs-alertmanager-mtls-cert-{{ $hubID }}{{ else }}obs-alertmanager-mtls-cert{{ end }}
          key:
            key: tls.key
            name: {{ if $hubID }}obs-alertmanager-mtls-cert-{{ $hubID }}{{ else }}obs-alertmanager-mtls-cert{{ end }}
          insecureSkipVerify: false
      {{ else }}
      {{hub $alertmanagerRoute := index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.annotations "acm-alertmanager-route" hub}}{{hub if and $alertmanagerRoute (contains "." $alertmanagerRoute) hub}}
      additionalAlertmanagerConfigs:
      - apiVersion: v2
        bearerToken:
          key: token
          name: {{hub $hubID := index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.annotations "acm-hub-cluster-id" hub}}{{hub if $hubID hub}}observability-alertmanager-accessor-{{hub $hubID hub}}{{hub else hub}}observability-alertmanager-accessor{{hub end hub}}
        scheme: https
        staticConfigs: [{{hub $alertmanagerRoute hub}}]
        tlsConfig:
          ca:
            key: service-ca.crt
            name: {{hub $hubID2 := index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.annotations "acm-hub-cluster-id" hub}}{{hub if $hubID2 hub}}hub-alertmanager-router-ca-{{hub $hubID2 hub}}{{hub else hub}}hub-alertmanager-router-ca{{hub end hub}}
          insecureSkipVerify: false
      {{hub end hub}}{{ end }}
      externalLabels:
        managed_cluster: {{hub index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.labels "clusterID" hub}}
      retention: 24h
