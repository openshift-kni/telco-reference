---
# RAN Observability configuration
# As a prerequisite for merging RAN Observability configuration with openshift-monitoring, apply the observabilityRoutePolicy on the HUB from the telco-hub required reference-crs. This is needed to copy the observatorium-api URL and hub cluster ID from the hub side open-cluster-management-observability namespace and make them available in the openshift-monitoring configmap.
# ACM 5.0+: alert forwarding fans out through the hub observatorium-api route (path /api/alertmanager/v2/default) using mTLS. The spoke endpoint-observability operator creates the obs-alertmanager-mtls-ca-<hubID> and obs-alertmanager-mtls-cert-<hubID> secrets in openshift-monitoring; the legacy hub-alertmanager-router-ca-<hubID> secret is no longer created.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    ran.openshift.io/ztp-deploy-wave: "1"
data:
  config.yaml: |
    alertmanagerMain:
      enabled: false
    telemeterClient:
      enabled: false
    nodeExporter:
      collectors:
        buddyinfo: {}
        cpufreq: {}
        ksmd: {}
        mountstats: {}
        netclass: {}
        netdev: {}
        processes: {}
        systemd: {}
        tcpstat: {}
    prometheusK8s:
      additionalAlertmanagerConfigs:
      - apiVersion: v2
        bearerToken:
          key: token
          name: {{hub $hubID := index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.annotations "acm-hub-cluster-id" hub}}{{hub if $hubID hub}}observability-alertmanager-accessor-{{hub $hubID hub}}{{hub else hub}}observability-alertmanager-accessor{{hub end hub}}
        pathPrefix: /api/alertmanager/v2/default
        scheme: https
        staticConfigs: {{hub $route := index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.annotations "acm-observatorium-api-route" hub}}{{hub if $route hub}}[{{hub $route hub}}]{{hub else hub}}[]{{hub end hub}}
        tlsConfig:
          ca:
            key: ca.crt
            name: {{hub if $hubID hub}}obs-alertmanager-mtls-ca-{{hub $hubID hub}}{{hub else hub}}obs-alertmanager-mtls-ca{{hub end hub}}
          cert:
            key: tls.crt
            name: {{hub if $hubID hub}}obs-alertmanager-mtls-cert-{{hub $hubID hub}}{{hub else hub}}obs-alertmanager-mtls-cert{{hub end hub}}
          key:
            key: tls.key
            name: {{hub if $hubID hub}}obs-alertmanager-mtls-cert-{{hub $hubID hub}}{{hub else hub}}obs-alertmanager-mtls-cert{{hub end hub}}
          insecureSkipVerify: false
      externalLabels:
        managed_cluster: {{hub index (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" .ManagedClusterName).metadata.labels "clusterID" hub}}
      retention: 24h
