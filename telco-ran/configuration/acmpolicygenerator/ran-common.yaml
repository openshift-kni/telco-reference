apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: common-latest
placementBindingDefaults:
  name: common-placement-binding
policyDefaults:
  # categories: []
  #controls:
  #  - PR.DS-1 Data-at-rest
  namespace: ztp-common
  # Use an existing placement rule so that placement bindings can be consolidated
  placement:
    labelSelector:
      common: "true"
      du-profile: "latest"
  remediationAction: inform
  severity: low
  # standards: []
  namespaceSelector:
    exclude:
      - kube-*
    include:
      - '*'
  evaluationInterval:
    compliant: 10m
    noncompliant: 10s
policies:
- name: common-latest-config-policy
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "1"
  manifests:
    - path: reference-crs/cluster-tuning/monitoring-configuration/ReduceMonitoringFootprint.yaml
    - path: reference-crs/cluster-tuning/iptables-alerter/IptablesAlerterConfig.yaml
    - path: reference-crs/disconnected-registry/DefaultCatsrc.yaml
      patches:
      - metadata:
          name: redhat-operators-disconnected
        spec:
          displayName: disconnected-redhat-operators
          image: registry.example.com:5000/disconnected-redhat-operators/disconnected-redhat-operator-index:v5.1
    # Optional: reuse an existing certified catalog or enable this mirrored one.
    # - path: reference-crs/nvidia-gpu-operator/NvidiaGpuCatalogSource.yaml
    # Optional NVIDIA video workaround: enable it through ClusterInstance custom manifests.
    - path: reference-crs/disconnected-registry/DisconnectedIDMS.yaml
      patches:
      - spec:
          imageDigestMirrors:
          - mirrors:
            - registry.example.com:5000
            source: registry.redhat.io
- name: common-latest-subscriptions-policy
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "2"
  manifests:
    # Logging operator
    - path: reference-crs/cluster-logging/ClusterLogNS.yaml
    - path: reference-crs/cluster-logging/ClusterLogOperGroup.yaml
    - path: reference-crs/cluster-logging/ClusterLogSubscription.yaml
    - path: reference-crs/cluster-logging/ClusterLogOperatorStatus.yaml
    - path: reference-crs/cluster-logging/ClusterLogServiceAccount.yaml
    - path: reference-crs/cluster-logging/ClusterLogServiceAccountAuditBinding.yaml
    - path: reference-crs/cluster-logging/ClusterLogServiceAccountInfrastructureBinding.yaml
    # Ptp operator
    - path: reference-crs/ptp-operator/PtpSubscriptionNS.yaml
    - path: reference-crs/ptp-operator/PtpSubscription.yaml
    - path: reference-crs/ptp-operator/PtpSubscriptionOperGroup.yaml
    - path: reference-crs/ptp-operator/PtpOperatorStatus.yaml
    # SRIOV operator
    - path: reference-crs/sriov-operator/SriovSubscriptionNS.yaml
    - path: reference-crs/sriov-operator/SriovSubscriptionOperGroup.yaml
    - path: reference-crs/sriov-operator/SriovSubscription.yaml
    - path: reference-crs/sriov-operator/SriovOperatorStatus.yaml
    # Storage operator
    - path: reference-crs/storage-lso/StorageNS.yaml
    - path: reference-crs/storage-lso/StorageOperGroup.yaml
    - path: reference-crs/storage-lso/StorageSubscription.yaml
    - path: reference-crs/storage-lso/StorageOperatorStatus.yaml
    # Optional: shared NFD for NVIDIA GPUs and ConnectX-8 NICs.
    # - path: reference-crs/nfd-operator/NfdSubscriptionNS.yaml
    # - path: reference-crs/nfd-operator/NfdSubscriptionOperGroup.yaml
    # - path: reference-crs/nfd-operator/NfdSubscription.yaml
    # - path: reference-crs/nfd-operator/NfdOperatorStatus.yaml
    #
    # NVIDIA Network Operator (optional; requires a certified catalog on the spoke)
    # - path: reference-crs/nvidia-network-operator/NvidiaNetworkSubscriptionNS.yaml
    # - path: reference-crs/nvidia-network-operator/NvidiaNetworkSubscriptionOperGroup.yaml
    # - path: reference-crs/nvidia-network-operator/NvidiaNetworkSubscription.yaml
    # - path: reference-crs/nvidia-network-operator/NvidiaNetworkOperatorStatus.yaml
    #
    # Optional NVIDIA Network Operator configuration with DOCA telemetry.
    # Customize NicClusterPolicy for your driver image and mirror before enabling.
    # - path: reference-crs/nvidia-network-operator/NicClusterPolicy.yaml
    # - path: reference-crs/nvidia-network-operator/DocaTelemetryRole.yaml
    # - path: reference-crs/nvidia-network-operator/DocaTelemetryRoleBinding.yaml
    # - path: reference-crs/nvidia-network-operator/DocaTelemetryService.yaml
    # - path: reference-crs/nvidia-network-operator/DocaTelemetryServiceMonitor.yaml
    #
    # Optional: NVIDIA GPU Operator installation. Mirror the certified catalog.
    # - path: reference-crs/nvidia-gpu-operator/NvidiaGpuSubscriptionNS.yaml
    # - path: reference-crs/nvidia-gpu-operator/NvidiaGpuSubscriptionOperGroup.yaml
    # - path: reference-crs/nvidia-gpu-operator/NvidiaGpuSubscription.yaml
    # - path: reference-crs/nvidia-gpu-operator/NvidiaGpuOperatorStatus.yaml
    #
    # LCA operator is used for orchestrating Image Based Upgrade for SNO
    # - path: reference-crs/lca/LcaSubscriptionNS.yaml
    # - path: reference-crs/lca/LcaSubscriptionOperGroup.yaml
    # - path: reference-crs/lca/LcaSubscription.yaml
    # - path: reference-crs/lca/LcaOperatorStatus.yaml
    #
    # OADP operator is used for backing up and restoring application during Image Based Upgrade
    # - path: reference-crs/data-protection/OadpSubscriptionNS.yaml
    # - path: reference-crs/data-protection/OadpSubscriptionOperGroup.yaml
    # - path: reference-crs/data-protection/OadpSubscription.yaml
    # - path: reference-crs/data-protection/OadpOperatorStatus.yaml
