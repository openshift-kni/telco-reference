---
# RAN Observability configuration
# ACM 5.0+: reads the observatorium route from the spoke hub-info-secret and forwards with mTLS.
# ACM 4.x: requires observabilityRoutePolicy in the 4.x hub reference for the alertmanager route and hub ID.
# When MCO is disabled and no route is available, omit alert forwarding.
# Keep the hub-info lookup and route guard on one line: the policy engine
# JSON-escapes config.yaml before rendering, so split actions add blank lines.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    ran.openshift.io/ztp-deploy-wave: "1"
    observability.open-cluster-management.io/unmanaged: "true"
data:
  config.yaml: |
    alertmanagerMain:
      enabled: false
    telemeterClient:
      enabled: false
    nodeExporter:
      collectors:
        buddyinfo: {}
        cpufreq: {}
        ksmd: {}
        mountstats: {}
        netclass: {}
        netdev: {}
        processes: {}
        systemd: {}
        tcpstat: {}
    prometheusK8s:
      (?<alertmanager_config>(?s:.*?))
      externalLabels:
        managed_cluster: (?<managed_cluster>.*)
      retention: 24h
