---
# RAN Observability configuration
# ACM 5.0+: observatorium-api URL is available from the spoke side; alerts forward via observatorium-api with mTLS.
# ACM 4.x:  requires the observabilityRoutePolicy from the telco-hub reference to propagate the alertmanager URL
#            and hub cluster ID as ManagedCluster annotations; alerts forward via the alertmanager route with ingress CA.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    ran.openshift.io/ztp-deploy-wave: "1"
data:
  config.yaml: |
    alertmanagerMain:
      enabled: false
    telemeterClient:
      enabled: false
    nodeExporter:
      collectors:
        buddyinfo: {}
        cpufreq: {}
        ksmd: {}
        mountstats: {}
        netclass: {}
        netdev: {}
        processes: {}
        systemd: {}
        tcpstat: {}
    prometheusK8s:
      additionalAlertmanagerConfigs:
      - apiVersion: v2
        bearerToken:
          key: token
          name: (?<observability_alertmanager_accessor>.*)
        scheme: https
        staticConfigs: (?<alertmanager_endpoint>.*)
        tlsConfig:
          ca:
            key: service-ca.crt
            name: (?<hub_alertmanager_router_ca>.*)
          insecureSkipVerify: false
      externalLabels:
        managed_cluster: (?<managed_cluster>.*)
      retention: 24h
