---
# Allow the spoke policy controller to read the 5.0 alert-forwarding contract.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-info-secret-reader
  namespace: open-cluster-management-addon-observability
  annotations:
    ran.openshift.io/ztp-deploy-wave: "1"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["hub-info-secret"]
  verbs: ["get"]
