---
apiVersion: nfd.openshift.io/v1
kind: NodeFeatureDiscovery
metadata:
  annotations:
    ran.openshift.io/ztp-deploy-wave: "10"
  name: nfd-instance
  namespace: openshift-nfd
spec:
  # Share this instance between GPU and Network Operators on each cluster.
  operand:
    image: registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:v5.0
    imagePullPolicy: IfNotPresent
    servicePort: 12000
  topologyUpdater: false
  workerConfig:
    configData: |
      core:
        sleepInterval: 60s
      sources:
        pci:
          deviceClassWhitelist:
          # Network controllers, including Ethernet and InfiniBand modes.
          - "02"
          # Display controllers and processing accelerators (NVIDIA GPUs).
          - "03"
          - "12"
          # Preserve the vendor-only labels used by NVIDIA Operators.
          deviceLabelFields:
          - "vendor"
        custom:
        # Identify CX-8 physical functions without changing standard PCI labels.
        - name: nvidia-connectx-8
          labels:
            custom-nvidia-connectx-8: "true"
          matchFeatures:
          - feature: pci.device
            matchExpressions:
              vendor: {op: In, value: ["15b3"]}
              device: {op: In, value: ["1023"]}
