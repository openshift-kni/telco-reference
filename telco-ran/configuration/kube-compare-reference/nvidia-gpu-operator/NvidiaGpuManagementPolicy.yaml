---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: nvidia-gpu-management-workload
  annotations:
    ran.openshift.io/ztp-deploy-wave: '1'
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: nvidia-gpu-operator
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
  matchConditions:
    - name: management-runtime
      expression: >-
        !has(object.spec.runtimeClassName) ||
        object.spec.runtimeClassName in ['nvidia', 'nvidia-cdi', 'nvidia-legacy']
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              annotations: {
                "target.workload.openshift.io/management":
                  '{"effect":"PreferredDuringScheduling"}'
              }
            }
          }
