---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: {{ .metadata.name }}
spec:
  conditions:
    # This store serves ZTP BMC and pull secrets in RHACM-managed cluster namespaces.
    # Create separate stores with appropriate conditions for other uses or namespaces.
    - namespaceSelector:
        matchExpressions:
          - key: cluster.open-cluster-management.io/managedCluster
            operator: Exists
          - key: cluster.open-cluster-management.io/managedCluster
            operator: NotIn
            values:
              - ""
  provider:
    vault:
      server: {{ .spec.provider.vault.server | quote }}
      path: {{ .spec.provider.vault.path | quote }}
      version: {{ .spec.provider.vault.version | quote }}
      auth:
        kubernetes:
          mountPath: {{ .spec.provider.vault.auth.kubernetes.mountPath | quote }}
          role: {{ .spec.provider.vault.auth.kubernetes.role | quote }}
          serviceAccountRef:
            name: {{ .spec.provider.vault.auth.kubernetes.serviceAccountRef.name }}
            namespace: {{ .spec.provider.vault.auth.kubernetes.serviceAccountRef.namespace }}
