---
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: cluster
{{- if and .spec.controllerConfig .spec.controllerConfig.certProvider (hasKey .spec.controllerConfig.certProvider "certManager") }}
spec:
  controllerConfig:
    certProvider:
      certManager:
        injectAnnotations: "true"
        issuerRef:
          name: {{ .spec.controllerConfig.certProvider.certManager.issuerRef.name | quote }}
          kind: {{ if eq .spec.controllerConfig.certProvider.certManager.issuerRef.kind "ClusterIssuer" }}ClusterIssuer{{ else }}Issuer{{ end }}
          group: cert-manager.io
        mode: Enabled
{{- else }}
spec: {}
{{- end }}
