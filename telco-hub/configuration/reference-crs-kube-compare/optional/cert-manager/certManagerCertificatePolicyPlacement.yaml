---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: monitor-certificates-placement
  namespace: default
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: common
              operator: Exists
    # Also monitor the hub's own certificates, including its CA
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: local-cluster
              operator: In
              values:
                - "true"
