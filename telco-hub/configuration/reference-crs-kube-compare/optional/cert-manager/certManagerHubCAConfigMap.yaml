---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager-hub-ca-bundle
  namespace: multicluster-engine
  labels:
    import.open-cluster-management.io/ca-bundle: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-29"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
data:
{{- if .data }}
  # Populate with the root CA PEM used by cert-manager to sign hub API/ingress certs.
  # This is the root of the CA chain that issued the hub API server certificate, not the leaf.
  # This bundle replaces the spoke's auto-detected CA. On a hub with connected spokes that
  # still serves another certificate, also include that certificate's CA (for the default
  # OpenShift API certificate: openshift-kube-apiserver/kube-apiserver-server-ca) until the
  # hub serves the cert-manager certificate. See README.md.
  ca-bundle.crt: |
{{ index .data "ca-bundle.crt" | trimSuffix "\n" | indent 4 }}
{{- end }}
