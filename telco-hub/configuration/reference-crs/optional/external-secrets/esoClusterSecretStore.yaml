---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: ztp-secret-provider
spec:
  conditions:
    # This store serves ZTP BMC and pull secrets in RHACM-managed cluster namespaces.
    # Create separate stores with appropriate conditions for other uses or namespaces.
    - namespaceSelector:
        matchExpressions:
          - key: cluster.open-cluster-management.io/managedCluster
            operator: Exists
          - key: cluster.open-cluster-management.io/managedCluster
            operator: NotIn
            values:
              - ""
  provider:
    vault:
      server: "https://vault.example.com:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-operator
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
