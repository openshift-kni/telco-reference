---
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: cluster
spec: {}
# Optional: use cert-manager for ESO webhook and plugin certificates.
# Keep spec: {} unless cert-manager, its CA injector, and a suitable issuer are
# ready before ESO is deployed. Replace spec: {} with the block below only when
# opting in; do not add a second spec key. Create an Issuer named eso-issuer in
# the external-secrets namespace (or use an existing ClusterIssuer and set
# kind: ClusterIssuer). The example ACME issuer for platform endpoints is not
# automatically suitable for ESO's internal certificates.
# spec:
#   controllerConfig:
#     certProvider:
#       certManager:
#         injectAnnotations: "true"
#         issuerRef:
#           name: eso-issuer
#           kind: Issuer
#           group: cert-manager.io
#         mode: Enabled
