---
# UIPlugin enables the Monitoring console plugin with RHACM integration.
# Requires Cluster Observability Operator and ACM Observability to be installed.
apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: monitoring
  annotations:
    # Deploy after cluster-observability-operator is ready
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: Monitoring
  monitoring:
    perses:
      enabled: true
