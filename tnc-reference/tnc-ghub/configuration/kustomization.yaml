# kustomization file including different overays over the
# reference crs
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
   
   ####################
   # Global hub cluster overlay
   ####################
   
  # if you use LocalStorage operator, edit and configure the patch
  #- overlays/lso/
  
  # if you use ODF, edit and configure storage settings
  #- overlays/odf/
  
  # if using LVMS (SNO) instead of ODF/LSO:
  - overlays/lvms/
  
  # other not optional overlays
  - overlays/gitops/
  - overlays/acm/
  - overlays/registry/

  # Install multi cluster global hub operator for Global Hub.
  - other-crs/required/mgh/

  # mandatory resources not managed by any overlay
  - reference-crs/required/talm/

  # include this content if you want to include the argocd
  # configuration and apps for gitops ztp management of workload cluster
  # installation and configuration
  # - overlays/gitops-ztp/
