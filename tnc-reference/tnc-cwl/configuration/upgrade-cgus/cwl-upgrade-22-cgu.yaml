---
apiVersion: ran.openshift.io/v1alpha1
kind: ClusterGroupUpgrade
metadata:
  name: cwl-upgrade-22
  namespace: ztp-core-policies
spec:
  actions:
    afterCompletion:
      deleteClusterLabels:
        upgrade-version-4-22: ""
      deleteObjects: true
  clusters:
  - cwl-site1
  enable: true
  managedPolicies:
  - cwl-upgrade-prep-22
  - cwl-upgrade-ocp-22
  - cwl-upgrade-olm-22
  - cwl-upgrade-validate-22
  # ODF uninstall/reinstall policy pair only to be used if ODF subscription fails to upgrade
  #- cwl-upgrade-odf-uninstall-22
  #- cwl-upgrade-odf-reinstall-22
  remediationStrategy:
    maxConcurrency: 1
    timeout: 480
