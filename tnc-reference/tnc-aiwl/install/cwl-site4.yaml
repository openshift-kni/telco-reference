apiVersion: siteconfig.open-cluster-management.io/v1alpha1
kind: ClusterInstance  
metadata:
  name: "cwl-site1"
  namespace: "cwl-site1"
spec:
  baseDomain: "npss.bos2.lab"
  pullSecretRef:
    name: "assisted-deployment-pull-secret"
  clusterImageSetNameRef: "openshift-4.20.16-disconnected"
  sshPublicKey: "ssh-rsa  cwl@bastion"
  clusterName: "cwl-site1"
  networkType: "OVNKubernetes"
  clusterType: HighlyAvailable
  cpuPartitioningMode: AllNodes
  extraManifestsRefs:
    - name: extra-manifests-configmap
  extraLabels:
    ManagedCluster:
      common: "core"
      version: "4.20"
      region: "zone-1"
      aiwl: "true"
      tnc-ver: "tnc6.1"
      odf-ext: "true"
      #odf-int: "true"
      kafka: "true"
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
  machineNetwork:
    - cidr: 172.31.61.0/24
  # For 3-node and standard clusters with static IPs, the API and Ingress IPs must be configured here
  apiVIPs: 
    - 172.31.61.80
  ingressVIPs: 
    - 172.31.61.81
  serviceNetwork:
    - cidr: 172.30.0.0/16
  additionalNTPSources:
    - 172.31.61.2
    - 192.168.22.2
  templateRefs:
    - name: ai-cluster-templates-v1
      namespace: open-cluster-management
##############################################################
  nodes:
# master1
    - hostName: "m1.cwl-site1.npss.bos2.lab"
      role: "master"
      bmcAddress: "redfish-virtualmedia://192.168.22.156/redfish/v1/Systems/System.Embedded.1"
      bmcCredentialsName:
        name: "bmh-secret-dell"
      bootMACAddress: "30:3e:a7:03:04:70"
      bootMode: "UEFISecureBoot" 
      automatedCleaningMode: "metadata"  
      nodeLabels:
        cluster.ocs.openshift.io/openshift-storage: "true"
      templateRefs:
        - name: ai-node-templates-v1
          namespace: open-cluster-management
      rootDeviceHints:
        wwn: "0x6f4ee08057eacf0066f17e190eae333b"
      nodeNetwork:
        interfaces:
          - name: "eno12399"
            macAddress: "30:3e:a7:03:04:70"
          - name: "eno12409"
            macAddress: "30:3e:a7:03:04:71"
          - name: "eno12419"
            macAddress: "30:3e:a7:03:04:72"
          - name: "eno12429"
            macAddress: "30:3e:a7:03:04:73"
        config:
          interfaces:
            - name: bond0
              description: "Bond 0"
              type: bond
              state: up
              mtu: 8900
              ipv4:
                address:
                - ip: 172.31.61.82
                  prefix-length: 24
                enabled: true
              ipv6:
                enabled: false
              link-aggregation:
                mode: '802.3ad'
                options:
                  miimon: '1000'
                port:
                  - eno12399
                  - eno12409
            - name: eno12399
              type: ethernet
              state: up
              mtu: 8900
              ipv4:
                enabled: false
              ipv6:
                enabled: false
            - name: eno12409
              type: ethernet
              state: up
              mtu: 8900
              ipv4:
                enabled: false
              ipv6:
                enabled: false
          dns-resolver:
            config:
              server:
                - 192.168.22.4
          routes:
            config:
              - destination: 0.0.0.0/0
                next-hop-address: 172.31.61.1
                next-hop-interface: bond0
