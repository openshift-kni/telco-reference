---
apiVersion: v1
metadata:
  name: mgmt1
baseDomain: example.com
compute:
- architecture: amd64
  hyperthreading: Enabled
  name: worker
  replicas: 0
controlPlane:
  architecture: amd64
  hyperthreading: Enabled
  name: master
  replicas: 3
networking:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  machineNetwork:
  - cidr: 172.31.61.0/24
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
# Replace the fields below with your network details
platform:
  baremetal:
    provisioningNetwork: "Disabled"
    apiVIPs:
    - 172.31.61.4
    ingressVIPs:
    - 172.31.61.5
imageDigestSources:
  - mirrors:
    - registry.bastion.example.com:9500/ocp/ocp4/openshift/release
    source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
  - mirrors:
    - registry.bastion.example.com:9500/ocp/ocp4/openshift/release-images
    source: quay.io/openshift-release-dev/ocp-release
# Add the mirror registry SSL certificate chain up to the CA itself.
additionalTrustBundle: |
  -----BEGIN CERTIFICATE-----
  REDACTED
  -----END CERTIFICATE-----
  -----BEGIN CERTIFICATE-----
  REDACTED
  -----END CERTIFICATE-----
# Add the mirror registry credentials to the pull secret.
pullSecret: '{"auths":{"<registry.bastion.example.com:9500>":{"auth": "aW5pdDo0R1XXXXXjdCbUoweUNuMWI1OTZBMmhkcEhjMw==","email": "user@redhat.com"},...}}}'
# Add the SSH public key to connect to the OCP nodes
sshKey: |
  ssh-rsa AAAAB3NzaC1yc2EA...
