---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../reference-crs/required/gitops/

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: hub-config
    path: init-argocd-app.yaml
  - target:
      group: ""
      version: v1
      kind: ConfigMap
      name: argocd-tls-certs-cm
    #path: argocd-tls-certs-cm-patch.yaml
    path: delete-argocd-tls-certs-cm.yaml
  - target:
      group: ""
      version: v1
      kind: Secret
      name: ztp-repo
    path: ztp-repo-secret-patch.yaml
  - target:
      group: ""
      version: v1
      kind: Policy
      name: ztp-argocd-plugins-installer
    path: ztp-plugins.yaml
  - target: 
      group: ""
      version: v1
      kind: ClusterRole
      name: hub-rds-argocd
    path: clusterrole-patch.yaml
