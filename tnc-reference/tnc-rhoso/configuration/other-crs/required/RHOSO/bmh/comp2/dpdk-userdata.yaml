#cloud-config
hostname: dpdk-compute-1
# overwrite the fqdn set by metal3 with the one generated by the baremetalset
fqdn: dpdk-compute-1
users:
  - name: cloud-admin
    passwd: $6$rounds=4096$.0qU3Ok5W9NLoGfn$xdphfg8jXr02G.8uKYV0uu2Qh2RErPGwUd8lc4tBBZDDW8lxDeteLC8YYwhi4DbbWEXDCSpBi.XX9WDd/WEyr.
    lock_passwd: false
    ssh-authorized-keys: ssh-rsa  cwl@bastion
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
bootcmd:
  # fix BLS entries
  - set -x; if [ -e /boot/loader/entries/ffffffffffffffffffffffffffffffff-* ]; then MACHINEID=$(cat /etc/machine-id) && rename "ffffffffffffffffffffffffffffffff" "$MACHINEID" /boot/loader/entries/ffffffffffffffffffffffffffffffff-* ; fi
