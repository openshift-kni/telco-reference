---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cpu-pinning-nova-sriov
  namespace: openstack
  annotations:
    ran.openshift.io/ztp-deploy-wave: "10"
data:
  25-cpu-pinning-nova.conf: |
    [DEFAULT]
    reserved_host_memory_mb = {{hub fromConfigMap "" .ManagedClusterName "sriov-host-mem"  hub}}
    reserved_huge_pages = node:0,size:1GB,count:{{hub fromConfigMap "" .ManagedClusterName "sriov-0-hugepages"  hub}}
    reserved_huge_pages = node:1,size:1GB,count:{{hub fromConfigMap "" .ManagedClusterName "sriov-1-hugepages"  hub}}
    #reserved_huge_pages = node:0,size:2M,count:50
    #reserved_huge_pages = node:1,size:2M,count:50
    [compute]
    cpu_shared_set = {{hub fromConfigMap "" .ManagedClusterName "sriov-cpu-shared"  hub}}
    cpu_dedicated_set = {{hub fromConfigMap "" .ManagedClusterName "sriov-cpu-dedicated"  hub}}
    [neutron]
    physnets = {{hub fromConfigMap "" .ManagedClusterName "sriov-physnets"  hub}}
    [neutron_physnet_{{hub fromConfigMap "" .ManagedClusterName "sriov-physnet1"  hub}}]
    numa_nodes = 0,1
    [neutron_physnet_{{hub fromConfigMap "" .ManagedClusterName "sriov-physnet2"  hub}}]
    numa_nodes = 0,1
    [neutron_tunnel]
    numa_nodes = 0,1

