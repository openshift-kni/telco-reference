apiVersion: dataplane.openstack.org/v1beta1
kind: OpenStackDataPlaneNodeSet
metadata:
  name: nodeset-sriov
  namespace: openstack
  annotations:
    ran.openshift.io/ztp-deploy-wave: "10"
spec:
  tlsEnabled: true
  env:
    - name: ANSIBLE_FORCE_COLOR
      value: "True"
  services:
  - bootstrap
  - configure-network
  - validate-network
  - install-os
  - configure-os
  - ssh-known-hosts
  - run-os
  - reboot-os
  - install-certs
  - ceph-client
  - ovn
  - neutron-ovn-igmp
  - neutron-metadata
  - neutron-sriov
  - libvirt
  - nova-custom-sriov-ceph
  - telemetry
  preProvisioned: false
  networkAttachments:
    - ctlplane
  baremetalSetTemplate:
    deploymentSSHSecret: dataplane-ansible-ssh-private-key-secret
    bmhNamespace: openstack
    cloudUserName: cloud-admin
    bmhLabelSelector:
      role: sriov
    ctlplaneInterface: bond0
    #dnsSearchDomains:
    #  - '{{hub fromConfigMap "" .ManagedClusterName "dns-domain" hub}}'
  nodeTemplate:
    ansibleSSHPrivateKeySecret: dataplane-ansible-ssh-private-key-secret
    #
    # Ceph related config
    #
    extraMounts:
    - extraVolType: Ceph
      mounts:
      - mountPath: /etc/ceph
        name: ceph
        readOnly: true
      volumes:
      - name: ceph
        secret:
          secretName: ceph-conf-files
    # End Ceph
    managementNetwork: ctlplane
    ansible:
      ansibleUser: cloud-admin
      ansiblePort: 22
      ansibleVars:
        edpm_bootstrap_release_version_package: []
            # image pull fails from private quay becuase of lack of GPG key in private quay.
            # Hence need to change policy.json
            #
            # Since we are using self signed certificates, podman login to quay
            # fails with TLS errors. Need to add quay certificate to the compute node
            #
            # Update the commands below to point to the correct location for Quay Certs
            # and to provide the correct quay credentials.
            # See if this can be replaced with a secret instead
            #
        edpm_bootstrap_command: |
          echo '{ "default": [{"type": "insecureAcceptAnything"}], "transports": { "docker-daemon": { "": [{"type": "insecureAcceptAnything"}] } } }' > /etc/containers/policy.json
          echo ''
          dnf localinstall -y http://{{hub fromConfigMap "" .ManagedClusterName "satellite-fqdn" hub}}/pub/katello-ca-consumer-latest.noarch.rpm
          subscription-manager register --org="default" --activationkey="rhoso-dev" --release=9.4
          echo ''
          dnf install -y sshpass
          mkdir -p /etc/docker/certs.d/{{hub fromConfigMap "" .ManagedClusterName "registry-fqdn" hub}}
          sshpass -p "<redacted>" scp -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no cwl@192.0.2.4:/home/cwl/TNC/virtual-rhoso/OCP/bastion-registry-ca.crt /etc/docker/certs.d/{{hub fromConfigMap "" .ManagedClusterName "registry-fqdn" hub}}/ca.crt
          podman login -u quay -p <redacted> {{hub fromConfigMap "" .ManagedClusterName  "registry-fqdn" hub}}
        edpm_container_registry_logins:
          '{{hub fromConfigMap "" .ManagedClusterName "registry-fqdn" hub}}':
            quay: registry
          #
          # Define mirror registry
          #
        edpm_podman_registries:
          - prefix: quay.io
            insecure: true
            location: quay.io
            mirrors:
            - location: '{{hub fromConfigMap "" .ManagedClusterName "registry-fqdn" hub}}/ocp/ocp4'
              insecure: true
          - prefix: registry.redhat.io
            insecure: true
            location: registry.redhat.io
            mirrors:
            - location: '{{hub fromConfigMap "" .ManagedClusterName "registry-fqdn" hub}}/ocp/ocp4'
              insecure: true
        neutron_physical_bridge_name: br-osp
        #neutron_public_interface_name: eth0
        edpm_network_config_template: |
          ---
          {{ `{% set mtu_list = [ctlplane_mtu] %}` }}
          {{ `{% for network in nodeset_networks %}` }}
          {{ `{{ mtu_list.append(lookup('vars', networks_lower[network] ~ '_mtu')) }}` }}
          {{ `{%- endfor %}` }}
          {{ `{% set min_viable_mtu = mtu_list | max %}` }}
          network_config:
            - type: linux_bond
              name: bond0
              use_dhcp: false
              use_dhcpv6: false
              bonding_options: "mode=802.3ad miimon=100"
              mtu: {{ `{{ min_viable_mtu }}` }}
              dns_servers: {{ `{{ ctlplane_dns_nameservers }}` }}
              domain: {{ `{{ dns_search_domains }}` }}
              addresses:
              - ip_netmask: {{ `{{ ctlplane_ip }}` }}/{{ `{{ ctlplane_cidr }}` }}
              routes: {{ `{{ ctlplane_host_routes }}` }}
              members:
                - type: interface
                  name: {{hub fromConfigMap "" .ManagedClusterName "sriov-bond0-port1" hub}}
                  mtu: {{ `{{ min_viable_mtu }}` }}
                  primary: true
                - type: interface
                  name: {{hub fromConfigMap "" .ManagedClusterName "sriov-bond0-port2" hub}}
                  mtu: {{ `{{ min_viable_mtu }}` }}
          {{ `{% for network in nodeset_networks if network not in ['external'] %}` }}
            - type: vlan
              device: bond0
              mtu: {{ `{{ lookup('vars', networks_lower[network] ~ '_mtu') }}` }}
              vlan_id: {{ `{{ lookup('vars', networks_lower[network] ~ '_vlan_id') }}` }}
              addresses:
              - ip_netmask:
                  {{ `{{ lookup('vars', networks_lower[network] ~ '_ip') }}` }}/{{ `{{ lookup('vars', networks_lower[network] ~ '_cidr') }}` }}
              routes: {{ `{{ lookup('vars', networks_lower[network] ~ '_host_routes') }}` }}
          {{ `{% endfor %}` }}
            - type: sriov_pf
              name: {{hub fromConfigMap "" .ManagedClusterName "sriov-physnet1-port" hub}}
              numvfs: {{hub fromConfigMap "" .ManagedClusterName "sriov-physnet1-numvfs" hub}}
              mtu: 8950
              use_dhcp: false
              use_dhcpv6: false
              promisc: true
            - type: sriov_pf
              name: {{hub fromConfigMap "" .ManagedClusterName "sriov-physnet2-port" hub}}
              numvfs: {{hub fromConfigMap "" .ManagedClusterName "sriov-physnet2-numvfs" hub}}
              mtu: 8950
              use_dhcp: false
              use_dhcpv6: false
              promisc: true
        edpm_neutron_sriov_agent_SRIOV_NIC_physical_device_mappings: '{{hub fromConfigMap "" .ManagedClusterName "sriov-physnet1" hub}}:{{hub fromConfigMap "" .ManagedClusterName "sriov-physnet1-port" hub}},{{hub fromConfigMap "" .ManagedClusterName "sriov-physnet2" hub}}:{{hub fromConfigMap "" .ManagedClusterName "sriov-physnet2-port" hub}}'
        edpm_nodes_validation_validate_controllers_icmp: false
        edpm_nodes_validation_validate_gateway_icmp: false
        edpm_nova_libvirt_qemu_group: hugetlbfs
        edpm_selinux_mode: enforcing
        edpm_fips_mode: check
        edpm_kernel_args: 'default_hugepagesz=1GB hugepagesz=1G hugepages=64 iommu=pt intel_iommu=on tsx=off isolcpus={{hub fromConfigMap "" .ManagedClusterName "sriov-cpu-dedicated" hub}}'
        edpm_tuned_isolated_cores: '{{hub fromConfigMap "" .ManagedClusterName "sriov-cpu-dedicated" hub}}'
        edpm_network_config_hide_sensitive_logs: false
        edpm_tuned_profile: cpu-partitioning-powersave
        service_net_map:
          nova_api_network: internalapi
          nova_libvirt_network: internalapi
        timesync_ntp_servers:
        - hostname: '{{hub fromConfigMap "" .ManagedClusterName "ntp-server" hub}}'
  nodes:
    sriov-compute-1:
      hostName: sriov-compute-1
      #userData: 
      #  name: nodeset-sriov-cloudinit-userdata-comp1
      #  namespace: openstack
      networkData: 
        name: nodeset-cloudinit-networkdata-comp1
        namespace: openstack
      networks:
        - name: ctlplane
          subnetName: subnet1
          defaultRoute: true
          fixedIP: 10.62.62.100
        - name: internalapi
          subnetName: subnet1
        - name: storage
          subnetName: subnet1
        - name: external
          subnetName: subnet1
        - name: tenant
          subnetName: subnet1
      ansible:
        ansibleHost: 10.62.62.100
        ansibleUser: cloud-admin
        ansibleVars:
          fqdn_internal_api: sriov-compute-1.{{hub fromConfigMap "" .ManagedClusterName "dns-domain" hub}}

