apiVersion: v1
data:
  03-ceph-nova.conf: |
    [libvirt]
    images_type=rbd
    images_rbd_pool=vms
    images_rbd_ceph_conf=/etc/ceph/ceph.conf
    images_rbd_glance_store_name=default_backend
    images_rbd_glance_copy_poll_interval=15
    images_rbd_glance_copy_timeout=600
    rbd_user=openstack
    #
    # Get the FSID from the external Ceph cluster
    # /etc/ceph/ceph.conf file
    # use it as the secret_uuid below
    #
    rbd_secret_uuid={{fromSecret "openstack" "rhoso-ceph" "ceph-fsid" | base64dec }}
kind: ConfigMap
metadata:
  name: ceph-nova
  namespace: openstack
  annotations:
    ran.openshift.io/ztp-deploy-wave: "10"

