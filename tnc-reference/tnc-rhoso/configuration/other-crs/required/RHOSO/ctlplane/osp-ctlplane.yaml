apiVersion: core.openstack.org/v1beta1
kind: OpenStackControlPlane
metadata:
  name: openstack-control-plane
  namespace: openstack
spec:
  #
  # Extra mounts defined to integrate with external Ceph
  #
  extraMounts:
    - name: v1
      region: r1
      extraVol:
        - propagation:
          - CinderVolume
          - CinderBackup
          - GlanceAPI
          extraVolType: Ceph
          volumes:
          - name: ceph
            projected:
              sources:
              - secret:
                  name: ceph-conf-files
          mounts:
          - name: ceph
            mountPath: "/etc/ceph"
            readOnly: true
  secret: osp-secret
  storageClass: ocs-external-storagecluster-ceph-rbd
  cinder:
    #apiOverride:
    #  route:
    #    haproxy.router.openshift.io/timeout: 60s
    template:
      databaseInstance: openstack
      secret: osp-secret
      cinderAPI:
        override:
          service:
            internal:
              metadata:
                annotations:
                  metallb.universe.tf/address-pool: internalapi
                  metallb.universe.tf/allow-shared-ip: internalapi
                  metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
              spec:
                type: LoadBalancer
      cinderScheduler:
        replicas: 1
      cinderBackup:
        customServiceConfig: |
          [DEFAULT]
          backup_driver = cinder.backup.drivers.ceph.CephBackupDriver
          backup_ceph_pool = backups
          backup_ceph_user = openstack
        networkAttachments:
        - storage
        replicas: 3
      cinderVolumes:
        ceph:
          customServiceConfig: |
            [DEFAULT]
            enabled_backends=ceph
            [ceph]
            volume_backend_name=ceph
            volume_driver=cinder.volume.drivers.rbd.RBDDriver
            rbd_ceph_conf=/etc/ceph/ceph.conf
            rbd_user=openstack
            rbd_pool=volumes
            rbd_flatten_volume_from_snapshot=False
            rbd_secret_uuid='{{hub fromConfigMap "" .ManagedClusterName "ceph-fsid" hub}}'
    uniquePodNames: true
  nova:
    apiOverride:
      route: {}
    template:
      apiServiceTemplate:
        override:
          service:
            internal:
              metadata:
                annotations:
                  metallb.universe.tf/address-pool: internalapi
                  metallb.universe.tf/allow-shared-ip: internalapi
                  metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
              spec:
                type: LoadBalancer
        replicas: 3
      metadataServiceTemplate:
        override:
          service:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/allow-shared-ip: internalapi
                metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
            spec:
              type: LoadBalancer
        replicas: 3
      schedulerServiceTemplate:
        customServiceConfig: |
          [filter_scheduler]
          enabled_filters = AvailabilityZoneFilter, ComputeFilter, ComputeCapabilitiesFilter, ImagePropertiesFilter, ServerGroupAntiAffinityFilter, ServerGroupAffinityFilter, PciPassthroughFilter, AggregateInstanceExtraSpecsFilter, NUMATopologyFilter
          available_filters = nova.scheduler.filters.all_filters
        replicas: 3
        #override:
        #  service:
        #    metadata:
        #      annotations:
        #        metallb.universe.tf/address-pool: internalapi
        #        metallb.universe.tf/allow-shared-ip: internalapi
        #        metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
        #    spec:
        #      type: LoadBalancer
      cellTemplates:
        cell0:
          cellDatabaseAccount: nova-cell0
          cellDatabaseInstance: openstack
          cellMessageBusInstance: rabbitmq
          conductorServiceTemplate:
            replicas: 1
          hasAPIAccess: true
        cell1:
          cellDatabaseAccount: nova-cell1
          cellDatabaseInstance: openstack-cell1
          cellMessageBusInstance: rabbitmq-cell1
          conductorServiceTemplate:
            replicas: 1
          noVNCProxyServiceTemplate:
                  enabled: true
                  networkAttachments:
                  - internalapi
                  - ctlplane
          hasAPIAccess: true
      preserveJobs: false
      secret: osp-secret
  dns:
    template:
      options:
      - key: server
        values:
        - '{{hub fromConfigMap "" .ManagedClusterName "dns-server" hub}}'
      override:
        service:
          metadata:
            annotations:
              metallb.universe.tf/address-pool: ctlplane
              metallb.universe.tf/allow-shared-ip: ctlplane
              metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "ctlplane-vip" hub}}'
          spec:
            type: LoadBalancer
      replicas: 1
  galera:
    templates:
      openstack:
        storageRequest: 5000M
        secret: osp-secret
        replicas: 3
      openstack-cell1:
        storageRequest: 5000M
        secret: osp-secret
        replicas: 3
  keystone:
    apiOverride:
      route: {}
    template:
      override:
        service:
          internal:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/allow-shared-ip: internalapi
                metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
            spec:
              type: LoadBalancer
      databaseInstance: openstack
      secret: osp-secret
  glance:
    #apiOverrides:
    #  default:
    #    route:
    #      haproxy.router.openshift.io/timeout: 60s
    template:
      customServiceConfig: |
        [DEFAULT]
        enabled_backends = default_backend:rbd
        [glance_store]
        default_backend = default_backend
        [default_backend]
        rbd_store_ceph_conf = /etc/ceph/ceph.conf
        store_description = "RBD backend"
        rbd_store_pool = images
        rbd_store_user = openstack
      databaseInstance: openstack
      storage:
        storageClass: "ocs-external-storagecluster-cephfs"
        storageRequest: 10G
      secret: osp-secret
      keystoneEndpoint: default
      glanceAPIs:
        default:
          #type: single
          replicas: 3
          override:
            service:
              internal:
                metadata:
                  annotations:
                    metallb.universe.tf/address-pool: internalapi
                    metallb.universe.tf/allow-shared-ip: internalapi
                    metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
                spec:
                  type: LoadBalancer
          networkAttachments:
          - storage
      preserveJobs: false
    uniquePodNames: true
  barbican:
    enabled: false
    apiOverride:
      route: {}
    template:
      databaseInstance: openstack
      secret: osp-secret
      barbicanAPI:
        replicas: 1
        override:
          service:
            internal:
              metadata:
                annotations:
                  metallb.universe.tf/address-pool: internalapi
                  metallb.universe.tf/allow-shared-ip: internalapi
                  metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
              spec:
                type: LoadBalancer
      barbicanWorker:
        replicas: 1
      barbicanKeystoneListener:
        replicas: 1
  memcached:
    templates:
      memcached:
         replicas: 3
  neutron:
    apiOverride:
      route: {}
    template:
      replicas: 3
      override:
        service:
          internal:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/allow-shared-ip: internalapi
                metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
            spec:
              type: LoadBalancer
      databaseInstance: openstack
      secret: osp-secret
      networkAttachments:
        - internalapi
      customServiceConfig: |
        [default]
        global_physnet_mtu = 8950
        service_plugins=ovn-router,port_forwarding
        [ml2]
        mechanism_drivers = ovn,sriovnicswitch
        extension_drivers=port_numa_affinity_policy,qos
        [ovn]
        vhost_sock_dir = /var/lib/vhost_sockets
        [ml2_type_vlan]
        network_vlan_ranges = '{{hub fromConfigMap "" .ManagedClusterName "neutron-net-vlan-ranges" hub}}'
  swift:
    enabled: false
    proxyOverride:
      route: {}
    template:
      swiftProxy:
        networkAttachments:
        - storage
        override:
          service:
            internal:
              metadata:
                annotations:
                  metallb.universe.tf/address-pool: internalapi
                  metallb.universe.tf/allow-shared-ip: internalapi
                  metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
              spec:
                type: LoadBalancer
        replicas: 2
        secret: osp-secret
      swiftRing:
        ringReplicas: 3
      swiftStorage:
        networkAttachments:
        - storage
        replicas: 3
        #storageClass: local-storage
        storageRequest: 10Gi
  ovn:
    template:
      ovnDBCluster:
        ovndbcluster-nb:
          replicas: 3
          dbType: NB
          storageRequest: 10G
          networkAttachment: internalapi
        ovndbcluster-sb:
          dbType: SB
          storageRequest: 10G
          networkAttachment: internalapi
      #ovnNorthd:
      #  networkAttachment: internalapi
      ovnController:
        networkAttachment: tenant
  placement:
    apiOverride:
      route: {}
    template:
      override:
        service:
          internal:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/allow-shared-ip: internalapi
                metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
            spec:
              type: LoadBalancer
      databaseInstance: openstack
      secret: osp-secret
  rabbitmq:
    templates:
      rabbitmq:
        replicas: 3
        override:
          service:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "rabbitmq-vip" hub}}'
            spec:
              type: LoadBalancer
      rabbitmq-cell1:
        replicas: 3
        override:
          service:
            metadata:
              annotations:
                metallb.universe.tf/address-pool: internalapi
                metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "rabbitmq-cell1-vip" hub}}'
            spec:
              type: LoadBalancer
  heat:
    apiOverride:
      route: {}
    cnfAPIOverride:
      route: {}
    enabled: false
    template:
      databaseInstance: openstack
      heatAPI:
        override:
          service:
            internal:
              metadata:
                annotations:
                  metallb.universe.tf/address-pool: internalapi
                  metallb.universe.tf/allow-shared-ip: internalapi
                  metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
              spec:
                type: LoadBalancer
        replicas: 1
      heatEngine:
        replicas: 1
      secret: osp-secret
  telemetry:
    enabled: true
    template:
      metricStorage:
        enabled: true
        dashboardsEnabled: true
        monitoringStack:
          alertingEnabled: true
          scrapeInterval: 30s
          storage:
            strategy: persistent
            retention: 24h
            persistent:
              pvcStorageRequest: 20G
      autoscaling:
        enabled: false
        aodh:
          #passwordSelectors:
          #databaseUser: aodh
          databaseAccount: aodh
          databaseInstance: openstack
          #memcachedInstance: memcached
          secret: osp-secret
        heatInstance: heat
      ceilometer:
        enabled: true
        secret: osp-secret
      logging:
        enabled: true
        annotations:
          metallb.universe.tf/address-pool: internalapi
          metallb.universe.tf/allow-shared-ip: internalapi
          metallb.universe.tf/loadBalancerIPs: '{{hub fromConfigMap "" .ManagedClusterName "internalapi-vip" hub}}'
  horizon:
    enabled: true
    apiOverride:
      route: {}
    template:
      replicas: 1
      secret: osp-secret
  octavia:
    enabled: false
    template:
      databaseInstance: openstack
      octaviaAPI:
        replicas: 1
      secret: osp-secret

