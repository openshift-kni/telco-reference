  #
  # Retrieve LDAP / IDM CA certificate with this command:
  #   scp -o StrictHostKeyChecking=no admin@idm1mgmt1.example.com:/etc/ipa/ca.crt ca.crt
  # And upload it to vault
  #

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ldap-ca-cert
  namespace: openshift-config
spec:
  dataFrom:
  - extract:
      conversionStrategy: Default
      decodingStrategy: None
      key: $path_to_secret_vault
      metadataPolicy: None
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ldap-ca-cert

