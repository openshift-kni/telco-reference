apiVersion: batch/v1
kind: Job
metadata:
  name: get-client-secret
  namespace: keycloak
spec:
  template:
    spec:
      serviceAccountName: keycloak-job-sa
      restartPolicy: Never
      containers:
      - name: get-client-secret
        image: {{hub fromConfigMap "" .ManagedClusterName "registry-fqdn" hub}}/ocp/ocp4/origin-cli-jq:latest
        command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail

            echo "[INFO] Authenticating to Keycloak..."
            export KEYCLOAKTOKEN=$(curl -s -k \
              -d "client_id=admin-cli" \
              -d "username=$ADMINUSER" \
              -d "password=$ADMINPASSWORD" \
              -d "grant_type=password" \
              "${KEYCLOAKHOSTNAME}/auth/realms/master/protocol/openid-connect/token" | jq -r '.access_token')

            if [[ -z "$KEYCLOAKTOKEN" || "$KEYCLOAKTOKEN" == "null" ]]; then
              echo "[ERROR] Failed to get Keycloak token" && exit 1
            fi

            echo "[INFO] Getting client ID..."
            export CLIENTID=$(curl -s -k \
              -H "Authorization: Bearer $KEYCLOAKTOKEN" \
              -H "Content-Type: application/json" \
              "${KEYCLOAKHOSTNAME}/auth/admin/realms/master/clients" | \
              jq -r -c ".[] | select(.clientId==\"${MANAGED_CLUSTER_NAME}-ocp\") | .id")

            if [[ -z "$CLIENTID" ]]; then
              echo "[ERROR] Client ID not found for ${MANAGED_CLUSTER_NAME}-ocp" && exit 1
            fi

            echo "[INFO] Getting client secret for ID $CLIENTID..."
            export CLIENTSECRET=$(curl -s -k \
              -H "Authorization: Bearer $KEYCLOAKTOKEN" \
              "${KEYCLOAKHOSTNAME}/auth/admin/realms/master/clients/${CLIENTID}/client-secret" | jq -r '.value')

            if [[ -z "$CLIENTSECRET" || "$CLIENTSECRET" == "null" ]]; then
              echo "[ERROR] Failed to retrieve client secret" && exit 1
            fi

            echo "[INFO] Creating/updating secret..."
            kubectl create secret generic keycloak-client-secret \
              --from-literal=clientSecret=${CLIENTSECRET} \
              -n openshift-config \
              --dry-run=client -o yaml | kubectl apply -f -

            echo "[INFO] Secret created successfully."
        env:
        - name: MANAGED_CLUSTER_NAME
          value: $managedclustername
        - name: KEYCLOAKHOSTNAME
          value: $keycloakhostname
        - name: ADMINUSER
          value: $adminuser
        - name: ADMINPASSWORD
          value: $adminpassword
