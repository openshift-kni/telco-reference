apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: rhoso-baseline-tnc61
policyDefaults:
  namespace: ztp-core-policies
  policySets: []
  placement:
    clusterSelectors:
      rhoso: "true"
      tnc-ver: "tnc6.1"
  remediationAction: "inform"
policies:
  - name: rhoso-cluster-config-tnc61
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "1"
    manifests:
      - path: reference-crs/required/other/operator-hub.yaml
      - path: reference-crs/required/other/catalog-source.yaml
        patches:
        - spec:
            image: '{{hub fromConfigMap "" .ManagedClusterName "registry-fqdn" hub}}/ocp/ocp4/redhat/redhat-operator-index:v4.20'
      - path: reference-crs/required/other/catalog-source.yaml
        patches:
          - metadata:
              name: rhoso-operators-disconnected
            spec:
              displayName:  RHOSO Disconnected Operators Catalog    
              image: '{{hub fromConfigMap "" .ManagedClusterName "registry-fqdn" hub}}/ocp/ocp4-osp/redhat/redhat-operator-index:v4.18'
      - path: other-crs/required/manifests/idms.yaml

  - name: rhoso-operator-subs-tnc61
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "5"
    manifests:
      - path: reference-crs/optional/logging/ClusterLogNS.yaml
      - path: reference-crs/optional/logging/ClusterLogOperGroup.yaml
      - path: reference-crs/optional/logging/ClusterLogSubscription.yaml
      - path: reference-crs/optional/logging/ClusterLogOperatorStatus.yaml
        patches:
        - status:
            components:
              refs:
              - kind: ClusterServiceVersion
                namespace: openshift-logging
                # Update with specific target version
                name: cluster-logging.v6.2.11
                conditions:
                  - type: Succeeded
                    status: "True"
                    reason: InstallSucceeded
#LOKI
      - path: other-crs/optional/LOG/LOKI/LokiNS.yaml
      - path: other-crs/optional/LOG/LOKI/LokiOperGroup.yaml
      - path: other-crs/optional/LOG/LOKI/LokiSubscription.yaml
        patches:
        - spec:
            installPlanApproval: Manual
            channel: stable-6.2
#SR-IOV
      - path: reference-crs/required/networking/sriov/SriovSubscriptionNS.yaml
      - path: reference-crs/required/networking/sriov/SriovSubscriptionOperGroup.yaml
      - path: reference-crs/required/networking/sriov/SriovSubscription.yaml
        patches:
        - spec:
            installPlanApproval: Manual
#ODF
      - path: reference-crs/required/storage/odf-external/odfNS.yaml
      - path: reference-crs/required/storage/odf-external/odfOperGroup.yaml
      - path: reference-crs/required/storage/odf-external/odfSubscription.yaml
        patches:
        - spec:
            installPlanApproval: Manual
            channel: stable-4.20
#METALLB
      - path: reference-crs/required/networking/metallb/metallbNS.yaml
      - path: reference-crs/required/networking/metallb/metallbOperGroup.yaml
      - path: reference-crs/required/networking/metallb/metallbSubscription.yaml
        patches:
        - spec:
            installPlanApproval: Manual
#NMSTATE
      - path: reference-crs/required/networking/NMStateNS.yaml
      - path: reference-crs/required/networking/NMStateOperGroup.yaml
      - path: reference-crs/required/networking/NMStateSubscription.yaml
        patches:
        - spec:
            installPlanApproval: Manual
#CERTMANAGER
      - path: other-crs/optional/CERT/CertMgrNS.yaml
      - path: other-crs/optional/CERT/CertMgrOperGroup.yaml
      - path: other-crs/optional/CERT/CertMgrSubscription.yaml
#COO - Pre-requisite for logging UI
      - path: other-crs/optional/COO/CooSubscription.yaml 
#ESO
      - path: other-crs/required/vault/ESO/ESONS.yaml
      - path: other-crs/required/vault/ESO/ESOOperGroup.yaml
      - path: other-crs/required/vault/ESO/ESOSubscription.yaml
        patches:
        - spec:
            installPlanApproval: Manual
      # OpenStack operator
      - path: other-crs/required/RHOSO/operator/RhosoNS.yaml
        patches:
          - metadata:
              name: openstack-operators
      - path: other-crs/required/RHOSO/operator/RhosoNS.yaml
        patches:
          - metadata:
              name: openstack
      - path: other-crs/required/RHOSO/operator/RhosoOperGroup.yaml
      - path: other-crs/required/RHOSO/operator/RhosoSubscription.yaml
      - path: other-crs/required/RHOSO/rhoso_instance.yaml

  - name: rhoso-operator-config-tnc61
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "7"
    manifests:
      # Set auto sizing of control plane nodes
      - path: reference-crs/optional/tuning/control-plane-system-reserved.yaml

      - path: reference-crs/optional/logging/ClusterLogServiceAccount.yaml
      - path: reference-crs/optional/logging/ClusterLogServiceAccountAuditBinding.yaml
      - path: reference-crs/optional/logging/ClusterLogServiceAccountInfrastructureBinding.yaml

      - path: reference-crs/required/networking/sriov/SriovOperatorConfig.yaml
        patches:
        - spec:
            # Required for mellanox plugins running with secureboot enabled.
            # Firmware MUST be pre-configured
            disablePlugins:
            - mellanox

      - path: reference-crs/required/networking/NMState.yaml

      ## Metal LB
      - path: reference-crs/required/networking/metallb/metallb.yaml
        patches:
        - spec:
            nodeSelector:
              node-role.kubernetes.io/worker: ""

### Configure ESO
      - path: other-crs/required/vault/ESO/ExternalSecretConfig.yaml
        #Following files are used to create the token needed for the 
        #authentication of the cluster to the Vault server
      - path: other-crs/required/vault/VaultNSfortokenreview.yaml
