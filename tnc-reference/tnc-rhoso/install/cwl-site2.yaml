          - name: "eno16505"
            macAddress: "50:7c:6f:55:40:3d"
          - name: "eno16515"
            macAddress: "50:7c:6f:55:40:3e"
          - name: "eno16525"
            macAddress: "50:7c:6f:55:40:3f"
        config:
          interfaces:
              - name: bond0
                description: "Bond0 - OSP_Ctlplane"
                type: bond
                state: up
                mtu: 8900
                ipv4:
                  address:
                  - ip: 10.62.62.10
                    prefix-length: 24
                  enabled: true
                ipv6:
                  enabled: false
                link-aggregation:
                  mode: '802.3ad'
                  options:
                    miimon: '1000'
                  port:
                    - eno16495
                    - eno16505
