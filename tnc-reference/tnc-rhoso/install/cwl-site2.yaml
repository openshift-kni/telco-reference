                type: vlan
                state: up
                mtu: 8900
                vlan:
                  base-iface: bond1
                  id: 96
                description: "Bond 1-OSP_tenant"
                ipv4:
                  address:
                  - ip: 10.1.110.10
                    prefix-length: 24
                  enabled: true
                ipv6:
                  enabled: false
              - name: eno16495
                type: ethernet
                state: up
                mtu: 8900
                ipv4:
                  enabled: false
                ipv6:
                  enabled: false
              - name: eno16505
                type: ethernet
                state: up
                mtu: 8900
                ipv4:
                  enabled: false
                ipv6:
                  enabled: false
              - name: eno16515
                type: ethernet
                state: up
                mtu: 8900
                ipv4:
                  enabled: false
                ipv6:
                  enabled: false
              - name: eno16525
                type: ethernet
                state: up
                mtu: 8900
                ipv4:
                  enabled: false
                ipv6:
                  enabled: false
          dns-resolver:
            config:
              server:
                - 192.0.2.4
          routes:
            config:
              - destination: 0.0.0.0/0
                next-hop-address: 172.31.61.1
                next-hop-interface: bond0.61
