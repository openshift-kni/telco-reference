apiVersion: siteconfig.open-cluster-management.io/v1alpha1
kind: ClusterInstance  
metadata:
  name: "cwl-site2"
  namespace: "cwl-site2"
spec:
  baseDomain: "example.com"
  pullSecretRef:
    name: "assisted-deployment-pull-secret"
  clusterImageSetNameRef: "openshift-4.20.16-disconnected"
  sshPublicKey: "ssh-rsa AAAAB3NzaC1yc2EA..."
  clusterName: "cwl-site2"
  networkType: "OVNKubernetes"
  clusterType: HighlyAvailable
  cpuPartitioningMode: AllNodes
  extraManifestsRefs:
    - name: extra-manifests-configmap
  extraLabels:
    ManagedCluster:
      common: "core"
      version: "4.20"
      region: "zone-1"
      rhoso: "true"
      tnc-ver: "tnc6.1"
      odf-ext: "true"
      #odf-int: "true"
      kafka: "true"
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
  machineNetwork:
    - cidr: 172.31.61.0/24
  # For 3-node and standard clusters with static IPs, the API and Ingress IPs must be configured here
  apiVIPs: 
    - 172.31.61.80
  ingressVIPs: 
    - 172.31.61.81
  serviceNetwork:
    - cidr: 172.30.0.0/16
  additionalNTPSources:
    - 172.31.61.2
    - 192.0.2.2
  templateRefs:
    - name: ai-cluster-templates-v1
      namespace: open-cluster-management
##############################################################
  nodes:
#control plane1
    - hostName: "m1.cwl-site2.example.com"
      role: "master"
      bmcAddress: "redfish-virtualmedia://192.0.2.164/redfish/v1/Systems/System.Embedded.1"
      bmcCredentialsName:
        name: "bmh-secret-dell"
      bootMACAddress: "50:7c:6f:55:40:3c"
      bootMode: "UEFISecureBoot" 
      automatedCleaningMode: "metadata"  
      templateRefs:
        - name: ai-node-templates-v1
          namespace: open-cluster-management
      rootDeviceHints:
        wwn: "0x55cd2e41556c7ad6"
