                mtu: 8900
                ipv4:
                  address:
                  - ip: 192.0.2.132
                    prefix-length: 28
                  enabled: true
                  dhcp: false
                ipv6:
                  enabled: false
                link-aggregation:
                  mode: '802.3ad'
                  options:
                    miimon: '1000'
                  port:
                    - eno16515
                    - eno16525
              - name: bond1.93
                type: vlan
                state: up
                mtu: 8900
                vlan:
                  base-iface: bond1
                  id: 93
                description: "Bond 1-OSP_internalAPI"
