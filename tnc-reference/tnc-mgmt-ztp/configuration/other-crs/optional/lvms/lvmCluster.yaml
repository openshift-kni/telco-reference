apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: sno-lvmcluster
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  storage:
    deviceClasses:
    - name: vg10
      default: true
      deviceSelector: 
        paths: 
          - /dev/disk/by-path/pci-0000:00:11.5-ata-3
      thinPoolConfig:
        name: thin-pool-10
        overprovisionRatio: 10
        sizePercent: 90

