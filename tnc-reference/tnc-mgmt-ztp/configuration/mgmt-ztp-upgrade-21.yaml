---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: mgmt-ztp-upgrade-21
policyDefaults:
  namespace: ztp-core-policies
  policySets: []
  placement:
    clusterSelectors:
      mgmt: "true"
      upgrade-version-4-21: ""
  remediationAction: "inform"
policies:
  - name: mgmt-ztp-upgrade-prep-21
    policyAnnotations:
      ran.openshift.io/soak-seconds: "30"
    manifests:
      - path: reference-crs/required/other/catalog-source.yaml
        patches:
        - spec:
            image: '{{hub fromConfigMap "" .ManagedClusterName "registry-fqdn" hub}}/ocp/ocp4/redhat/redhat-operator-index:v4.21'
        - status:
            connectionState:
              lastObservedState: READY
      - path: reference-crs/required/other/catalog-source.yaml
        patches:
        - metadata:
            name: certified-operators-disconnected
          spec:
            displayName: Certified Disconnected Operators Catalog
            image: '{{hub fromConfigMap "" .ManagedClusterName "registry-fqdn" hub}}/ocp/ocp4/redhat/certified-operator-index:v4.21'
      - path: reference-crs/optional/other/upgrade-ack.yaml
        patches:
        - data:
            "ack-4.20-sigstore-in-4.21": "true"
      - path: other-crs/custom-manifests/mcp-worker.yaml
        patches:
        - spec:
            # Adjust as needed based on spare capacity, cluster design, and application requirements
            maxUnavailable: 100%
            paused: true
  - name: mgmt-ztp-upgrade-logging-uninstall-21
    policyAnnotations:
      ran.openshift.io/soak-seconds: "60"
    evaluationInterval:
      compliant: never
    manifests:
      - path: reference-crs/optional/logging/ClusterLogSubscription.yaml
        complianceType: mustnothave
      - path: other-crs/optional/LOG/LOKI/LokiSubscription.yaml
        complianceType: mustnothave
  - name: mgmt-ztp-upgrade-logging-install-21
    policyAnnotations:
      ran.openshift.io/soak-seconds: "60"
    extraDependencies:
      - name: mgmt-ztp-upgrade-logging-uninstall-21
        namespace: ztp-core-policies
        compliance: Compliant
    manifests:
      - path: reference-crs/optional/logging/ClusterLogNS.yaml
      - path: reference-crs/optional/logging/ClusterLogOperGroup.yaml
      - path: reference-crs/optional/logging/ClusterLogSubscription.yaml
        patches:
        - spec:
            channel: stable-6.5
            installPlanApproval: Automatic
        - status:
            state: AtLatestKnown
      - path: reference-crs/optional/logging/ClusterLogOperatorStatus.yaml
        patches:
        - status:
            components:
              refs:
              - kind: ClusterServiceVersion
                namespace: openshift-logging
                name: cluster-logging.v6.5.0
                conditions:
                  - type: Succeeded
                    status: "True"
                    reason: InstallSucceeded
      - path: other-crs/optional/LOG/LOKI/LokiNS.yaml
      - path: other-crs/optional/LOG/LOKI/LokiOperGroup.yaml
      - path: other-crs/optional/LOG/LOKI/LokiSubscription.yaml
        patches:
        - spec:
            channel: stable-6.5
            installPlanApproval: Automatic
        - status:
            state: AtLatestKnown
  - name: mgmt-ztp-upgrade-ocp-21
    manifests:
      - path: reference-crs/optional/other/ClusterVersion.yaml
        patches:
        - spec:
            channel: stable-4.21
            desiredUpdate:
              version: 4.21.24
              image: registry.bastion.example.com:9500/ocp/ocp4/openshift/release-images@sha256:9ed4f92ef5d48054797e08789b9a09ebeb9bfd9c6cb6ebba2876e4e81aa09c73
              force: true
        - status:
            history:
            - version: 4.21.24
              state: "Completed"
  - name: mgmt-ztp-upgrade-odf-uninstall-21
    policyAnnotations:
      ran.openshift.io/soak-seconds: "60"
    evaluationInterval:
      compliant: never
    manifests:
      - path: reference-crs/required/storage/odf-external/odfSubscription.yaml
        complianceType: mustnothave
      - path: other-crs/optional/ODF/OdfOperatorCSV.yaml
        complianceType: mustnothave
        objectSelector:
          matchLabels:
            odf.openshift.io/odf-operator: "true"
  - name: mgmt-ztp-upgrade-odf-install-21
    policyAnnotations:
      ran.openshift.io/soak-seconds: "60"
    extraDependencies:
      - name: mgmt-ztp-upgrade-odf-uninstall-21
        namespace: ztp-core-policies
        compliance: Compliant
    manifests:
      - path: reference-crs/required/storage/odf-external/odfNS.yaml
      - path: reference-crs/required/storage/odf-external/odfOperGroup.yaml
      - path: reference-crs/required/storage/odf-external/odfSubscription.yaml
        patches:
        - spec:
            channel: stable-4.21
            installPlanApproval: Automatic
        - status:
            state: AtLatestKnown
  - name: mgmt-ztp-upgrade-olm-21
    policyAnnotations:
      ran.openshift.io/soak-seconds: "60"
    manifests:
      - path: other-crs/required/reference/acm/acmSubscription.yaml
        patches:
        - spec:
            channel: release-2.17
        - status:
            state: AtLatestKnown
      - path: other-crs/required/reference/gitops/gitopsSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: other-crs/required/reference/talm/talmSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: reference-crs/required/networking/NMStateSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: other-crs/optional/LSO/LsoSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: reference-crs/optional/cert-manager/certManagerSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: other-crs/required/vault/ESO/ESOSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: other-crs/optional/CNV/CnvSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: other-crs/optional/COO/CooSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: other-crs/required/QUAY/QuaySubscription.yaml
        patches:
        - spec:
            channel: stable-3.17
        - status:
            state: AtLatestKnown
      - path: other-crs/optional/KAFKA/kafkaSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: other-crs/optional/OTEL/OtelSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: other-crs/optional/AAP/AapSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
      - path: other-crs/optional/ACS/AcsSubscription.yaml
        patches:
        - status:
            state: AtLatestKnown
  - name: mgmt-ztp-upgrade-validate-21
    policyAnnotations:
      ran.openshift.io/soak-seconds: "30"
    manifests:
      - path: reference-crs/custom-manifests/subscription-validator.yaml
