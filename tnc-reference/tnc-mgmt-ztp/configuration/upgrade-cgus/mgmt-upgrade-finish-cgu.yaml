apiVersion: ran.openshift.io/v1alpha1
kind: ClusterGroupUpgrade
metadata:
  name: mgmt-upgrade-finish
  namespace: ztp-core-policies
spec:
  actions:
    afterCompletion:
      deleteClusterLabels:
        upgrade-finish: ""
      deleteObjects: true
  clusters:
  - mgmt1
  enable: true
  managedPolicies:
  - mgmt-ztp-upgrade-workers-1
  - mgmt-ztp-upgrade-workers-2
  - mgmt-ztp-upgrade-workers-3
  remediationStrategy:
    maxConcurrency: 1
    timeout: 480
  blockingCRs:
  - name: mgmt-upgrade-22
    namespace: ztp-core-policies
---
