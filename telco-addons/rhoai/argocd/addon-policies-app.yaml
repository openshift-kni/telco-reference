apiVersion: v1
kind: Namespace
metadata:
  name: addon-policies-sub
  annotations:
    argocd.argoproj.io/sync-wave: "100"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-policies
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: addon-policies-sub
  project: addon-policy-app-project
  source:
    path: policygenerator
    repoURL: https://github.com/javierpena/rhoai-tests
    targetRevision: main
    # uncomment the below plugin if you will be adding the plugin binaries in the same repo->dir where
    # the PolicyGenerator .yaml files exist AND use the ../../hack/patch-argocd-dev.sh script to re-patch the deployment-repo-server
    #  plugin:
    #    name: kustomize-with-local-plugins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

