# This CR verifies the installation/upgrade of the Redhat ODS Operator
apiVersion: operators.coreos.com/v1
kind: Operator
metadata:
  name: rhods-operator.redhat-ods-operator
  annotations:
    ran.openshift.io/ztp-deploy-wave: "2"
status:
  components:
    refs:
    - kind: Subscription
      namespace: redhat-ods-operator 
      conditions:
      - type: CatalogSourcesUnhealthy
        status: "False"
    - kind: InstallPlan
      namespace: redhat-ods-operator 
      conditions:
      - type: Installed
        status: "True"
    - kind: ClusterServiceVersion
      namespace: redhat-ods-operator 
      conditions:
      - type: Succeeded
        status: "True"
        reason: InstallSucceeded

