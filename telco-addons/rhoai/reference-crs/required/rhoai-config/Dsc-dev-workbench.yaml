apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  annotations:
    ran.openshift.io/ztp-deploy-wave: "10"
spec:
  components:
    # 1. Enable Kueue for workload scheduling
    kueue:
      autoCreateQueues: true
      defaultClusterQueueName: default
      defaultLocalQueueName: default
      managementState: Unmanaged
    # 2. Enable Trainer v2, Ray and Workbenches
    ray:
      managementState: Managed
    trainingoperator:
      managementState: Managed
    workbenches:
      managementState: Managed
    # 3. Recommended: Enable ModelRegistry for tracking models
    modelregistry:
      managementState: Managed
      registriesNamespace: rhoai-model-registries
    # 4. Optional: Enable dashboard and other components as needed
    dashboard:
      managementState: Managed
